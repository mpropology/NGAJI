<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perkembangan Iqro PAYM Kedungwuni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7ED;
    --ink:#1C2B22;
    --muted:#8A8272;
    --muted2:#6B7568;
    --green-deep:#0B4D3A;
    --green-mid:#146B4F;
    --green-soft:#DCEAE3;
    --gold:#C9A227;
    --gold-light:#E8CD7A;
    --card-border:#E7E1D2;
    --tab-bg:#F1EEE2;
    --red:#B3452C;
    --red-bg:#FBEDE8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  }
  .display{font-family:'Amiri', serif;}
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px 96px;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .header .icon{
    width:40px;height:40px;border-radius:12px;background:var(--green-deep);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .header h1{font-size:20px;margin:0;font-weight:700;}
  .header p{font-size:12px;margin:2px 0 0;color:var(--muted);}

  .tabs{display:flex;gap:4px;background:var(--tab-bg);border-radius:12px;padding:4px;margin-bottom:20px;}
  .tabs button{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:14px;font-weight:600;border:none;border-radius:8px;padding:9px 0;
    background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;
  }
  .tabs button.active{background:#fff;color:var(--green-deep);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

  .banner{
    border-radius:16px;padding:16px 20px;margin-bottom:10px;text-align:center;
    background:linear-gradient(135deg,var(--green-deep),var(--green-mid));color:var(--bg);
  }
  .banner h2{font-size:17px;margin:0 0 2px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;}
  .banner p{font-size:12px;margin:0;opacity:.8;}

  .row{
    display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid var(--card-border);
    padding:12px 16px;background:#fff;margin-bottom:10px;
  }
  .row.top3{border-color:var(--gold);box-shadow:0 2px 10px rgba(201,162,39,0.18);}
  .row.quran{background:linear-gradient(90deg, rgba(232,205,122,0.16), rgba(255,255,255,0.9));}
  .rank{
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;background:var(--tab-bg);color:var(--green-deep);flex-shrink:0;
  }
  .row.top3 .rank{background:var(--green-deep);color:var(--bg);}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--green-mid),var(--green-deep));color:var(--bg);font-weight:700;font-size:18px;
  }
  .row-main{flex:1;min-width:0;}
  .row-name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .row-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;}
  .badge.quran{background:linear-gradient(90deg,var(--gold-light),var(--gold));color:#3B2F0B;}
  .badge.jilid{background:var(--green-soft);color:var(--green-deep);}
  .row-sub{font-size:12px;color:var(--muted2);margin-top:3px;}
  .comp-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .comp-chip-mini{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--tab-bg);color:var(--green-mid);font-weight:500;}
  .khatam-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-left:6px;}
  .khatam-col .num{font-weight:700;font-size:18px;color:var(--gold);font-family:'Amiri', serif;}
  .khatam-col .label{font-size:10px;color:var(--muted);}

  .chip-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;}
  .chip-scroll::-webkit-scrollbar{height:4px;}
  .chip{
    display:flex;align-items:center;gap:8px;flex-shrink:0;border-radius:999px;padding:6px 12px 6px 6px;
    border:1px solid var(--card-border);background:#fff;cursor:pointer;font-family:inherit;
  }
  .chip.active{background:var(--green-deep);color:var(--bg);border-color:var(--green-deep);}
  .chip .mini-avatar{width:22px;height:22px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .chip.active .mini-avatar{background:var(--gold-light);}
  .chip-add{
    width:36px;height:36px;border-radius:50%;border:2px dashed var(--gold);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;cursor:pointer;
    font-size:18px;font-weight:700;
  }

  .card{border-radius:16px;background:#fff;border:1px solid var(--card-border);padding:16px;margin-bottom:14px;}
  .card-head{display:flex;align-items:center;justify-content:between;gap:8px;margin-bottom:12px;}
  .name-input{
    font-weight:600;font-size:16px;background:transparent;border:none;border-bottom:1px dashed var(--card-border);
    flex:1;min-width:0;font-family:inherit;color:var(--ink);padding:2px 0;
  }
  .name-input:focus{outline:none;border-color:var(--gold);}
  .btn-danger{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--red-bg);color:var(--red);border:none;cursor:pointer;font-family:inherit;flex-shrink:0;}

  .subtabs{display:flex;gap:4px;background:var(--tab-bg);border-radius:12px;padding:4px;margin-bottom:16px;}
  .subtabs button{flex:1;font-size:12px;font-weight:600;border:none;border-radius:8px;padding:8px 4px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;}
  .subtabs button.active{background:#fff;color:var(--green-deep);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

  label.field-label{font-size:11px;font-weight:600;color:var(--muted2);display:block;margin-bottom:6px;}
  input[type="number"], input[type="text"]{
    width:100%;border-radius:10px;border:1px solid var(--card-border);padding:9px 12px;font-size:14px;
    font-family:inherit;color:var(--ink);
  }
  input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .field{margin-bottom:14px;}

  .jilid-picker{display:flex;gap:6px;}
  .jilid-picker button{
    flex:1;border-radius:10px;border:1px solid var(--card-border);background:#fff;padding:9px 0;
    font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .jilid-picker button.active{background:var(--green-deep);color:var(--bg);border-color:var(--green-deep);}

  .upgrade-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;
    background:var(--gold-light);color:#3B2F0B;border:none;padding:10px 0;font-weight:600;font-size:14px;
    cursor:pointer;font-family:inherit;margin-top:4px;
  }
  .khatam-row{display:flex;align-items:center;justify-content:space-between;background:var(--tab-bg);border-radius:10px;padding:9px 12px;}
  .khatam-row .left{display:flex;align-items:center;gap:6px;color:var(--green-deep);font-weight:600;font-size:14px;}
  .khatam-row button{border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--green-deep);color:var(--bg);cursor:pointer;font-family:inherit;}

  .save-btn{
    width:100%;margin-top:16px;border:none;border-radius:10px;padding:11px 0;font-weight:600;font-size:14px;
    background:var(--green-deep);color:var(--bg);cursor:pointer;font-family:inherit;
  }

  .comp-label{font-size:11px;font-weight:600;color:var(--muted2);margin-bottom:8px;}
  .comp-toggles{display:flex;flex-wrap:wrap;gap:8px;}
  .comp-toggle{
    display:flex;align-items:center;gap:4px;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:500;
    border:1px solid var(--card-border);background:#fff;cursor:pointer;font-family:inherit;color:#3F4A41;
  }
  .comp-toggle.active{background:var(--green-deep);color:var(--bg);border-color:var(--green-deep);}

  .status{text-align:center;padding:40px 0;color:var(--muted);font-size:14px;}
  .setup-banner{
    background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;font-size:12px;margin-bottom:16px;
    line-height:1.5;
  }
  .setup-banner code{background:#fff;padding:1px 4px;border-radius:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon">📖</div>
    <div>
      <h1 class="display">BTQ Tracker</h1>
      <p id="subheader">Progres Mengaji · memuat...</p>
    </div>
  </div>

  <div id="setupBanner" class="setup-banner" style="display:none;">
    ⚠️ Backend belum disambungkan. Buka <code>index.html</code>, cari baris <code>const API_URL</code>, lalu isi dengan URL Web App Apps Script kamu.
  </div>

  <div class="tabs">
    <button id="tabLeaderboard" class="active" onclick="setView('leaderboard')">🏆 Peringkat</button>
    <button id="tabInput" onclick="setView('input')">✏️ Input Guru</button>
  </div>

  <div id="content"><div class="status">Memuat data...</div></div>
</div>

<script>
/* ====== KONFIGURASI ======
   Ganti URL di bawah dengan URL Web App hasil deploy Apps Script kamu.
   Bentuknya: https://script.google.com/macros/s/XXXXXXXX/exec
*/
const API_URL = "https://script.google.com/macros/s/AKfycbx_4nhhKecTeNh-6uxI8ZTtiv7LxGnWTLG0bpT3CsghNr3vS545LjHDNMhLtiwRf5qa/exec";

const COMPETENCIES = ["Makhraj","Mad","Nun Sukun","Mim Sukun","Idgham","Ikhfa","Qalqalah","Ghunnah","Waqaf","Kelancaran"];

let students = [];
let view = "leaderboard";
let selectedId = null;
let guruMode = "jilid";
let formState = {};

function apiConfigured(){
  return API_URL && API_URL.indexOf("PASTE_URL") === -1;
}

async function apiGet(action){
  const res = await fetch(`${API_URL}?action=${action}`);
  return res.json();
}

async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function loadStudents(){
  if(!apiConfigured()){
    document.getElementById("setupBanner").style.display = "block";
    document.getElementById("content").innerHTML = '<div class="status">Sambungkan backend dulu untuk melihat data.</div>';
    document.getElementById("subheader").textContent = "Progres Mengaji";
    return;
  }
  try{
    const data = await apiGet("list");
    students = (data.students || []).map(s => ({...s, competencies: s.competencies || []}));
    if(!selectedId && students.length) selectedId = students[0].id;
    document.getElementById("subheader").textContent = `Progres Mengaji · ${students.length} Santri`;
    render();
  }catch(err){
    document.getElementById("content").innerHTML = `<div class="status">Gagal memuat data. Cek koneksi / URL Apps Script.</div>`;
  }
}

function setView(v){
  view = v;
  document.getElementById("tabLeaderboard").classList.toggle("active", v==="leaderboard");
  document.getElementById("tabInput").classList.toggle("active", v==="input");
  render();
}

function rankStudents(list){
  const quran = list.filter(s=>s.level==="quran")
    .sort((a,b)=> b.khatam-a.khatam || b.quranHalaman-a.quranHalaman);
  const jilid = list.filter(s=>s.level==="jilid")
    .sort((a,b)=> b.jilid-a.jilid || b.jilidHalaman-a.jilidHalaman);
  return [...quran, ...jilid];
}

function initials(name){
  return (name||"?").trim().charAt(0).toUpperCase();
}

function render(){
  if(view === "leaderboard") renderLeaderboard();
  else renderGuruInput();
}

function renderLeaderboard(){
  const ranked = rankStudents(students);
  let html = `
    <div class="banner">
      <h2 class="display">🏆 Papan Peringkat Mengaji</h2>
      <p>Al-Qur'an &amp; khatam di puncak · Jilid diurutkan 6 → 1</p>
    </div>`;
  ranked.forEach((s, i) => {
    const rank = i+1;
    const isQuran = s.level === "quran";
    const top3 = rank <= 3;
    const compsHtml = (s.competencies||[]).length
      ? `<div class="comp-chips">${s.competencies.map(c=>`<span class="comp-chip-mini">${c}</span>`).join("")}</div>`
      : "";
    const sub = isQuran
      ? `Halaman ${s.quranHalaman}/604${s.surat ? ` · ${s.surat}${s.ayat ? " : "+s.ayat : ""}` : ""}`
      : `Halaman ${s.jilidHalaman}`;
    html += `
      <div class="row ${top3 ? "top3":""} ${isQuran ? "quran":""}">
        <div class="rank">${rank}</div>
        <div class="avatar">${initials(s.name)}</div>
        <div class="row-main">
          <div class="row-name-line">
            <span class="row-name">${escapeHtml(s.name)}</span>
            <span class="badge ${isQuran?"quran":"jilid"}">${isQuran ? "Al-Qur'an" : "Jilid "+s.jilid}</span>
          </div>
          <div class="row-sub">${sub}</div>
          ${compsHtml}
        </div>
        ${isQuran ? `<div class="khatam-col"><span class="num">★ ${s.khatam}</span><span class="label">khatam</span></div>` : ""}
      </div>`;
  });
  document.getElementById("content").innerHTML = html;
}

function renderGuruInput(){
  if(!students.length){
    document.getElementById("content").innerHTML = '<div class="status">Belum ada santri.</div>';
    return;
  }
  if(!selectedId) selectedId = students[0].id;
  const student = students.find(s=>s.id===selectedId) || students[0];

  if(formState.id !== student.id){
    formState = {
      id: student.id,
      jilid: student.jilid, jilidHalaman: student.jilidHalaman,
      quranHalaman: student.quranHalaman, khatam: student.khatam,
      surat: student.surat, ayat: student.ayat,
    };
    guruMode = student.level === "quran" ? "quranHalaman" : "jilid";
  }

  let chips = students.map(s => `
    <div class="chip ${s.id===selectedId?"active":""}" onclick="selectStudent('${s.id}')">
      <div class="mini-avatar">${initials(s.name)}</div>
      <span>${escapeHtml(s.name)}</span>
    </div>`).join("");
  chips += `<button class="chip-add" onclick="addStudent()" title="Tambah santri">+</button>`;

  let html = `
    <div class="banner">
      <h2 class="display">✏️ Input Nilai Guru</h2>
      <p>Pilih santri, lalu catat progres hari ini</p>
    </div>
    <div class="chip-scroll">${chips}</div>
    <div class="card">
      <div class="card-head">
        <input class="name-input" value="${escapeHtml(student.name)}" onchange="renameStudent('${student.id}', this.value)" />
        <span class="badge ${student.level==="quran"?"quran":"jilid"}">${student.level==="quran" ? "Al-Qur'an" : "Jilid "+student.jilid}</span>
        ${students.length>1 ? `<button class="btn-danger" onclick="removeStudent('${student.id}','${escapeHtml(student.name)}')">Hapus</button>` : ""}
      </div>
      <div class="subtabs">
        <button class="${guruMode==="jilid"?"active":""}" onclick="setGuruMode('jilid')">Jilid</button>
        <button class="${guruMode==="quranHalaman"?"active":""}" onclick="setGuruMode('quranHalaman')">Al-Qur'an Halaman</button>
        <button class="${guruMode==="suratAyat"?"active":""}" onclick="setGuruMode('suratAyat')">Surat &amp; Ayat</button>
      </div>
      <div id="modeFields"></div>
      <button class="save-btn" id="saveBtn" onclick="saveProgress()">Simpan Progres</button>
    </div>
    <div class="card">
      <div class="comp-label">KOMPETENSI BACAAN</div>
      <div class="comp-toggles">
        ${COMPETENCIES.map(c => `
          <button class="comp-toggle ${student.competencies.includes(c)?"active":""}" onclick="toggleCompetency('${student.id}','${c}')">
            ${student.competencies.includes(c) ? "✓ " : ""}${c}
          </button>`).join("")}
      </div>
    </div>`;

  document.getElementById("content").innerHTML = html;
  renderModeFields();
}

function renderModeFields(){
  const el = document.getElementById("modeFields");
  if(!el) return;
  if(guruMode === "jilid"){
    el.innerHTML = `
      <div class="field">
        <label class="field-label">JILID (1–6)</label>
        <div class="jilid-picker">
          ${[1,2,3,4,5,6].map(j=>`<button class="${Number(formState.jilid)===j?"active":""}" onclick="setField('jilid', ${j})">${j}</button>`).join("")}
        </div>
      </div>
      <div class="field">
        <label class="field-label">HALAMAN JILID</label>
        <input type="number" min="1" value="${formState.jilidHalaman ?? ""}" oninput="setField('jilidHalaman', this.value)" />
      </div>
      ${Number(formState.jilid)===6 ? `<button class="upgrade-btn" onclick="naikQuran()">Khatam Jilid 6, Naik ke Al-Qur'an →</button>` : ""}
    `;
  } else if(guruMode === "quranHalaman"){
    el.innerHTML = `
      <div class="field">
        <label class="field-label">HALAMAN AL-QUR'AN SEKARANG (1–604)</label>
        <input type="number" min="1" max="604" value="${formState.quranHalaman ?? ""}" oninput="setField('quranHalaman', this.value)" />
      </div>
      <div class="khatam-row">
        <div class="left">★ Khatam: ${formState.khatam ?? 0}x</div>
        <button onclick="tambahKhatam()">↻ Tambah Khatam +1</button>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="field">
        <label class="field-label">NAMA SURAT</label>
        <input type="text" placeholder="cth. Al-Baqarah" value="${formState.surat ?? ""}" oninput="setField('surat', this.value)" />
      </div>
      <div class="field">
        <label class="field-label">AYAT SEKARANG</label>
        <input type="text" placeholder="cth. 12" value="${formState.ayat ?? ""}" oninput="setField('ayat', this.value)" />
      </div>
    `;
  }
}

function setField(key, val){
  formState[key] = val;
  if(key === "jilid") renderModeFields();
}

function setGuruMode(mode){
  guruMode = mode;
  renderModeFields();
  document.querySelectorAll(".subtabs button").forEach(b=>b.classList.remove("active"));
  const idx = {jilid:0, quranHalaman:1, suratAyat:2}[mode];
  document.querySelectorAll(".subtabs button")[idx].classList.add("active");
}

function selectStudent(id){
  selectedId = id;
  render();
}

function naikQuran(){
  formState.quranHalaman = 1;
  guruMode = "quranHalaman";
  renderGuruInput();
}

function tambahKhatam(){
  formState.khatam = (Number(formState.khatam)||0) + 1;
  formState.quranHalaman = 1;
  renderModeFields();
}

async function saveProgress(){
  const btn = document.getElementById("saveBtn");
  btn.textContent = "Menyimpan...";
  let patch = { id: selectedId };
  if(guruMode === "jilid"){
    patch.level = "jilid";
    patch.jilid = Number(formState.jilid);
    patch.jilidHalaman = Number(formState.jilidHalaman);
  } else if(guruMode === "quranHalaman"){
    patch.level = "quran";
    patch.quranHalaman = Number(formState.quranHalaman);
    patch.khatam = Number(formState.khatam);
  } else {
    patch.level = "quran";
    patch.surat = formState.surat;
    patch.ayat = formState.ayat;
  }
  await apiPost({ action: "update", student: patch });
  await loadStudents();
  btn.textContent = "✓ Tersimpan";
  setView("input");
  setTimeout(()=>{ if(document.getElementById("saveBtn")) document.getElementById("saveBtn").textContent = "Simpan Progres"; }, 1200);
}

async function renameStudent(id, name){
  await apiPost({ action:"update", student:{ id, name } });
  await loadStudents();
}

async function addStudent(){
  await apiPost({ action:"add", name:"Santri Baru" });
  await loadStudents();
  selectedId = students[students.length-1]?.id || selectedId;
  render();
}

async function removeStudent(id, name){
  if(!confirm(`Hapus ${name} dari daftar santri?`)) return;
  await apiPost({ action:"remove", id });
  selectedId = null;
  await loadStudents();
  setView("input");
}

async function toggleCompetency(id, comp){
  await apiPost({ action:"toggleCompetency", id, competency: comp });
  await loadStudents();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

loadStudents();
</script>
</body>
</html>
