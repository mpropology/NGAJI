<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Progres Mengaji</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Leaderboard Mengaji</h1>
            <p>Pantau progres bacaan dan hafalan siswa</p>
        </header>

        <div class="card">
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Peringkat</th>
                        <th>Nama Siswa</th>
                        <th>Capaian (Surah/Jilid)</th>
                        <th>Ayat/Halaman</th>
                        <th>Pembaruan Terakhir</th>
                    </tr>
                </thead>
                <tbody id="student-data">
                    <!-- Data JSON akan dimuat di sini oleh JavaScript -->
                </tbody>
            </table>
        </div>
        
        <div class="footer-links">
            <a href="admin.html" class="btn">Masuk ke Panel Admin</a>
        </div>
    </div>

        <script>
        // GANTI URL DI BAWAH DENGAN URL DARI GOOGLE APPS SCRIPT ANDA
        const SCRIPT_URL = 'PASTE_URL_WEB_APP_ANDA_DI_SINI';

        async function loadLeaderboard() {
            const tbody = document.getElementById('student-data');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data progres...</td></tr>';
            
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                tbody.innerHTML = ''; // Bersihkan tulisan loading
                
                // Kita balik datanya (reverse) agar progres yang baru diinput tampil paling atas
                data.reverse().forEach((siswa, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><span class="rank-badge">${index + 1}</span></td>
                        <td><strong>${siswa.nama}</strong></td>
                        <td><span class="capaian-badge">${siswa.capaian}</span></td>
                        <td>${siswa.detail}</td>
                        <td>${siswa.tanggal}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat data. Pastikan koneksi internet stabil.</td></tr>';
            }
        }

        // Jalankan fungsi saat halaman dimuat
        window.onload = loadLeaderboard;
    </script>

</body>
</html>
