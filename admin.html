<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Mengaji</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ Panel Admin</h1>
            <p>Perbarui progres mengaji siswa</p>
        </header>

        <div class="card">
            <form id="admin-form">
                <div class="form-group">
                    <label for="nama">Nama Siswa</label>
                    <input type="text" id="nama" placeholder="Masukkan nama siswa..." required>
                </div>
                <div class="form-group">
                    <label for="capaian">Capaian (Jilid/Surah)</label>
                    <input type="text" id="capaian" placeholder="Contoh: Jilid 3 atau An-Naba" required>
                </div>
                <div class="form-group">
                    <label for="detail">Detail (Halaman/Ayat)</label>
                    <input type="text" id="detail" placeholder="Contoh: Hal 15 atau Ayat 1-10" required>
                </div>
                <button type="submit" class="btn btn-primary">Simpan Progres</button>
            </form>
        </div>

        <div class="footer-links">
            <a href="index.html" class="btn">Kembali ke Leaderboard</a>
        </div>
    </div>

    <script>
        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Logika penyimpanan data akan diletakkan di sini.
            // Karena GitHub Pages statis, kita butuh API eksternal (seperti Google Sheets)
            alert('Fungsi simpan siap dihubungkan dengan database/Google Sheets!');
            this.reset();
        });
    <script>
        // GANTI URL DI BAWAH DENGAN URL DARI GOOGLE APPS SCRIPT ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_4nhhKecTeNh-6uxI8ZTtiv7LxGnWTLG0bpT3CsghNr3vS545LjHDNMhLtiwRf5qa/exec';

        document.getElementById('admin-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = this.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Menyimpan...';
            btn.disabled = true;

            const data = {
                nama: document.getElementById('nama').value,
                capaian: document.getElementById('capaian').value,
                detail: document.getElementById('detail').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                });
                alert('Progres siswa berhasil disimpan!');
                this.reset();
            } catch (error) {
                alert('Terjadi kesalahan jaringan. Coba lagi.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
    
</body>
</html>
